# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions
# More info on Python, GitHub Actions, and Azure App Service: https://aka.ms/python-webapps-actions
#
# ─────────────────────────────────────────────────────────────────────────
# Deployment credentials — read this before wondering why the deploy failed.
#
# This workflow arrived in this repository as a COPY (commit 6b4a27a, "Sync
# Page Industries portal backend copy to source"). The GUID-suffixed secret
# names below — AZUREAPPSERVICE_CLIENTID_EF07D806…, and its TENANTID /
# SUBSCRIPTIONID siblings — are auto-generated by the Azure Portal for ONE
# specific repository at the moment CI/CD is connected. They exist in the
# repository this file was copied from, not in this one, so `azure/login`
# received three empty strings and reported:
#
#     Using auth-type: SERVICE_PRINCIPAL. Not all values are present.
#     Ensure 'client-id' and 'tenant-id' are supplied.
#
# Two auth modes are supported so this can be unblocked either way. The
# preflight step below picks whichever is configured and, if neither is, fails
# in the first two seconds with the exact list of what to add — rather than
# handing back the message above, which names the symptom and not the cause.
#
#   PUBLISH PROFILE (simplest — one secret, nothing to configure in Entra)
#     Azure Portal → safeops-server → Overview → Download publish profile.
#     Paste the whole XML into a repo secret: AZURE_WEBAPP_PUBLISH_PROFILE
#
#   OIDC / federated credential (no long-lived secret, more setup)
#     Repo secrets: AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID
#     AND — the part that is easy to miss — the Entra app registration needs a
#     federated credential whose subject names THIS repository. Copying the
#     values across from the old repo is NOT enough on its own: the token
#     exchange is scoped to a repo, so a credential issued for the original
#     repo is rejected here (AADSTS70021, "No matching federated identity
#     record found").
#
# The GUID-suffixed names are still honoured as a fallback, so nothing breaks
# if the portal ever wires this repository up itself.
# ─────────────────────────────────────────────────────────────────────────

name: Build and deploy Python app to Azure Web App - safeops-server

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  # Overridable with a repository VARIABLE (Settings → Variables), not a secret.
  #
  # It is a variable rather than a hard-coded string because this repository is
  # the Page Industries copy of the backend, while `safeops-server` is the app
  # service the ORIGINAL product deploys to. Pointing this pipeline at that app
  # would publish the Page build over the other product's backend. Set
  # AZURE_WEBAPP_NAME to the Page app service before enabling deploys, or
  # confirm deliberately that this really is the intended target.
  AZURE_WEBAPP_NAME: ${{ vars.AZURE_WEBAPP_NAME || 'safeops-server' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      # 🛠️ Local Build Section (Optional)
      # The following section in your workflow is designed to catch build issues early on the client side, before deployment. This can be helpful for debugging and validation. However, if this step significantly increases deployment time and early detection is not critical for your workflow, you may remove this section to streamline the deployment process.
      - name: Create and Start virtual environment and Install dependencies
        run: |
          python -m venv antenv
          source antenv/bin/activate
          pip install -r requirements.txt

      # By default, when you enable GitHub CI/CD integration through the Azure portal, the platform automatically sets the SCM_DO_BUILD_DURING_DEPLOYMENT application setting to true. This triggers the use of Oryx, a build engine that handles application compilation and dependency installation (e.g., pip install) directly on the platform during deployment. Hence, we exclude the antenv virtual environment directory from the deployment artifact to reduce the payload size.
      - name: Upload artifact for deployment jobs
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: |
            .
            !antenv/

      # 🚫 Opting Out of Oryx Build
      # If you prefer to disable the Oryx build process during deployment, follow these steps:
      # 1. Remove the SCM_DO_BUILD_DURING_DEPLOYMENT app setting from your Azure App Service Environment variables.
      # 2. Refer to sample workflows for alternative deployment strategies: https://github.com/Azure/actions-workflow-samples/tree/master/AppService


  deploy:
    runs-on: ubuntu-latest
    needs: build

    # Restored from the portal-generated template, where it was dropped when
    # this file was copied. It is not cosmetic: if the Azure credentials were
    # created as ENVIRONMENT secrets (scoped to an environment named
    # Production) rather than repository secrets, a job that does not declare
    # the environment cannot see them and they resolve to empty strings —
    # producing the identical "Not all values are present" failure even though
    # the secrets plainly exist in Settings.
    environment:
      name: 'Production'
      url: ${{ steps.deploy-oidc.outputs.webapp-url || steps.deploy-publish-profile.outputs.webapp-url }}

    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app

      # Fails in seconds with the specific missing names, instead of letting
      # azure/login report a generic "not all values are present" that gives no
      # indication of WHICH values or WHERE they belong.
      - name: Check deployment credentials
        id: creds
        env:
          PUBLISH_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID || secrets.AZUREAPPSERVICE_CLIENTID_EF07D806ABEF4ADC9D109D08D8B8E64A }}
          TENANT_ID: ${{ secrets.AZURE_TENANT_ID || secrets.AZUREAPPSERVICE_TENANTID_599CC67E7A1F44D5981A776CA279843A }}
          SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID || secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_41CD105B25B74ED6B1A6AE61D602F1DF }}
        run: |
          echo "Deployment target: $AZURE_WEBAPP_NAME"

          if [ -n "$PUBLISH_PROFILE" ]; then
            echo "mode=publish-profile" >> "$GITHUB_OUTPUT"
            echo "Auth mode: publish profile."
            exit 0
          fi

          # Plain `if` blocks rather than `[ -z "$X" ] && missing=…` chains:
          # this step runs under `bash -eo pipefail`, where a test that
          # evaluates false makes the whole list return non-zero, and the
          # credential check would abort on the first secret that IS present.
          missing=""
          if [ -z "$CLIENT_ID" ]; then missing="$missing AZURE_CLIENT_ID"; fi
          if [ -z "$TENANT_ID" ]; then missing="$missing AZURE_TENANT_ID"; fi
          if [ -z "$SUBSCRIPTION_ID" ]; then missing="$missing AZURE_SUBSCRIPTION_ID"; fi

          if [ -z "$missing" ]; then
            echo "mode=oidc" >> "$GITHUB_OUTPUT"
            echo "Auth mode: OIDC federated credential."
            exit 0
          fi

          # Written to the job summary as well as the log: the log line scrolls
          # past, the summary is the first thing shown on a failed run.
          {
            echo "## Deployment is not configured"
            echo
            echo "No Azure credentials are available to this repository, so the deploy cannot run."
            echo "This workflow was copied from another repository; its secrets did not come with it."
            echo
            echo "Missing for OIDC:\`$missing\`"
            echo
            echo "Add **one** of the following under **Settings → Secrets and variables → Actions**:"
            echo
            echo "**Option A — publish profile (simplest, one secret)**"
            echo "- \`AZURE_WEBAPP_PUBLISH_PROFILE\` — the full XML from"
            echo "  Azure Portal → \`$AZURE_WEBAPP_NAME\` → Overview → *Download publish profile*."
            echo
            echo "**Option B — OIDC**"
            echo "- \`AZURE_CLIENT_ID\`, \`AZURE_TENANT_ID\`, \`AZURE_SUBSCRIPTION_ID\`"
            echo "- Plus a federated credential on the Entra app registration whose subject names"
            echo "  **this** repository. Copying the values from the old repository is not enough —"
            echo "  the OIDC token is scoped per repository and will be rejected with AADSTS70021."
            echo
            echo "If the secrets already exist as **environment** secrets, confirm the environment is"
            echo "named \`Production\` — this job declares that environment and can only read secrets"
            echo "scoped to it."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "::error title=Azure credentials not configured::Missing:$missing — see the job summary for what to add."
          exit 1

      - name: Login to Azure
        if: steps.creds.outputs.mode == 'oidc'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID || secrets.AZUREAPPSERVICE_CLIENTID_EF07D806ABEF4ADC9D109D08D8B8E64A }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID || secrets.AZUREAPPSERVICE_TENANTID_599CC67E7A1F44D5981A776CA279843A }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID || secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_41CD105B25B74ED6B1A6AE61D602F1DF }}

      - name: 'Deploy to Azure Web App'
        if: steps.creds.outputs.mode == 'oidc'
        uses: azure/webapps-deploy@v3
        id: deploy-oidc
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          slot-name: 'Production'

      - name: 'Deploy to Azure Web App (publish profile)'
        if: steps.creds.outputs.mode == 'publish-profile'
        uses: azure/webapps-deploy@v3
        id: deploy-publish-profile
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          slot-name: 'Production'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
